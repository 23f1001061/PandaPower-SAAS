name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-flyio:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TARGET == 'flyio' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy web
        run: flyctl deploy --remote-only --app ${{ secrets.FLY_APP_NAME }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy worker
        run: |
          flyctl deploy --remote-only \
            --app ${{ secrets.FLY_WORKER_APP_NAME }} \
            --config infra/fly.worker.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TARGET == 'render' }}
    steps:
      - name: Trigger Render web service deploy
        run: |
          curl -fsSL -X POST \
            "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}"
      - name: Trigger Render worker deploy
        if: ${{ secrets.RENDER_WORKER_SERVICE_ID != '' }}
        run: |
          curl -fsSL -X POST \
            "https://api.render.com/deploy/srv-${{ secrets.RENDER_WORKER_SERVICE_ID }}?key=${{ secrets.RENDER_WORKER_DEPLOY_KEY }}"

  notify:
    needs: [deploy-flyio, deploy-render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "Deploy finished on $(date -u). Refs: ${{ github.ref }}"
