name: powersys

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-powersys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powersys}
      POSTGRES_DB:       ${POSTGRES_DB:-powersys}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-powersys}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  web:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-powersys}:${POSTGRES_PASSWORD:-powersys}@postgres:5432/${POSTGRES_DB:-powersys}
      REDIS_URL:    redis://redis:6379/0
      FLASK_ENV:    ${FLASK_ENV:-development}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ./reports:/app/reports
      - ./uploads:/app/uploads

  worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-powersys}:${POSTGRES_PASSWORD:-powersys}@postgres:5432/${POSTGRES_DB:-powersys}
      REDIS_URL:    redis://redis:6379/0
      FLASK_ENV:    ${FLASK_ENV:-development}
    command: >
      celery -A extension.celery worker
             --loglevel=info
             --concurrency=2
             -Q default
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - ./reports:/app/reports
      - ./uploads:/app/uploads

  beat:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-powersys}:${POSTGRES_PASSWORD:-powersys}@postgres:5432/${POSTGRES_DB:-powersys}
      REDIS_URL:    redis://redis:6379/0
      FLASK_ENV:    ${FLASK_ENV:-development}
    command: ["celery", "-A", "extension.celery", "beat", "--loglevel=info"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: [production]   # only run via `--profile production`
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web

volumes:
  pg-data:
  redis-data:
